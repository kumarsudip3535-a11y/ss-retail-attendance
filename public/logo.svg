<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64">
  <defs>
    <linearGradient id="ssrsBadgeGradient" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
  </defs>

  <!-- Icon: location pin with a checkmark, standing in for GPS tracking + verified attendance -->
