<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <!-- iOS doesn't read the web manifest for "Add to Home Screen" like
         Android does — these tags are what make it open full-screen
         (no Safari address bar) once added, instead of as a bookmark. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Chromium/Edge deprecated reading the apple-prefixed tag above in
         favor of this standard one — kept both since Safari/iOS still
         only recognizes the apple-prefixed version. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SSRS Attendance" />
    <title>SS Retail Attendance</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
